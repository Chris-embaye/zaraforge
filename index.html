<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaraForge — Build Apps, Music & Designs with AI</title>
    <meta name="description" content="The all-in-one AI creative platform. Build full-stack apps, produce music, design logos, and edit video — no code required. Start free." />
    <meta name="keywords" content="no-code builder, AI app builder, music studio, logo maker, web builder, no code" />
    <meta name="author" content="ZaraForge" />

    <!-- Open Graph / Facebook / iMessage / LinkedIn -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://zaraforge.com/" />
    <meta property="og:title"       content="ZaraForge — Build Apps, Music & Designs with AI" />
    <meta property="og:description" content="The all-in-one AI creative platform. Build full-stack apps, produce music, design logos, and edit video — no code required. Start free." />
    <meta property="og:image"       content="https://zaraforge.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="ZaraForge" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://zaraforge.com/" />
    <meta name="twitter:title"       content="ZaraForge — Build Apps, Music & Designs with AI" />
    <meta name="twitter:description" content="The all-in-one AI creative platform. No code required. Start free." />
    <meta name="twitter:image"       content="https://zaraforge.com/og-image.png" />

    <!-- ── Content Security Policy ─────────────────────────────────────────── -->
    <!-- Blocks XSS, enforces HTTPS-only scripts, prevents clickjacking.       -->
    <!-- Tighten script-src domains before shipping to production.             -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://sc-static.net https://snap.licdn.com https://static.ads-twitter.com;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com data:;
      img-src     'self' data: blob: https:;
      media-src   'self' blob:;
      connect-src 'self' https:;
      frame-src   'none';
      object-src  'none';
      base-uri    'self';
      form-action 'self';
    " />
    <!-- X-Frame-Options via meta (full header needed server-side) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZaraForge" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2310b981'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='40' fill='url(%23g)'%3EZ%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/zaraforge-logo.png" />
    <!-- GitHub Pages SPA: restore path from 404 redirect -->
    <script>
      (function(){
        var p = new URLSearchParams(location.search).get('p');
        if (p) {
          var q = new URLSearchParams(location.search).get('q');
          history.replaceState(null, '', '/' + p + (q ? '?' + q : '') + location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-builder-bg text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
